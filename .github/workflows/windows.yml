# 실제 윈도우에서 사용자와 같은 순서(설치 → 점검 → 실행 → 영상 처리)로 확인한다.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NOPAUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 예전 버전의 바탕화면 바로가기 (새 설치가 지우는지 보려고)
        shell: pwsh
        run: |
          $p = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Video Editing.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($p)
          $s.TargetPath = Join-Path $env:GITHUB_WORKSPACE 'run_app.bat'
          $s.Save()
          if (-not (Test-Path -LiteralPath $p)) { Write-Error "예전 바로가기를 못 만듦: $p"; exit 1 }

      - name: setup_windows.bat (사용자가 처음 한 번 실행하는 설치)
        shell: cmd
        run: call setup_windows.bat

      - name: 바탕화면 바로가기가 만들어졌는지 (AI 도우미, 예전 Video Editing은 지워짐)
        shell: pwsh
        run: |
          # setup_windows.bat과 같은 방법으로 이름을 만든다 (0xB3C4 0xC6B0 0xBBF8 = 도우미)
          $desktop = [Environment]::GetFolderPath('Desktop')
          $name = 'AI ' + [char]0xB3C4 + [char]0xC6B0 + [char]0xBBF8 + '.lnk'
          $p = Join-Path $desktop $name
          if (-not (Test-Path -LiteralPath $p)) { Write-Error "바로가기 없음: $p"; exit 1 }
          # WScript.Shell은 영어 윈도우에서 한글 이름 파일을 못 열어서 영어 이름으로 복사해 읽는다
          $copy = Join-Path $env:RUNNER_TEMP 'shortcut-check.lnk'
          Copy-Item -LiteralPath $p -Destination $copy -Force
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($copy).TargetPath
          $target
          if (-not $target.EndsWith('run_app.bat')) { Write-Error "바로가기 대상이 다름: $target"; exit 1 }
          $old = Join-Path $desktop 'Video Editing.lnk'
          if (Test-Path -LiteralPath $old) { Write-Error "예전 바로가기가 남아 있음: $old"; exit 1 }
          $tmp = Join-Path $desktop 'ai-helper-new.lnk'
          if (Test-Path -LiteralPath $tmp) { Write-Error "임시 바로가기가 남아 있음: $tmp"; exit 1 }

      - name: 리졸브 Scripts 메뉴에 스크립트가 들어갔는지
        shell: pwsh
        run: |
          $p = Join-Path $env:APPDATA 'Blackmagic Design\DaVinci Resolve\Support\Fusion\Scripts\Utility\AI_Helper_Connect.lua'
          if (-not (Test-Path -LiteralPath $p)) { Write-Error "스크립트 없음: $p"; exit 1 }
          if (Select-String -LiteralPath $p -SimpleMatch '@@MAILBOX_HEX@@') { Write-Error "우체통 경로가 채워지지 않음"; exit 1 }
          if (Select-String -LiteralPath $p -SimpleMatch '"@@MAILBOX_LONG_HEX@@"') { Write-Error "긴 우체통 경로 자리가 채워지지 않음"; exit 1 }
          Get-Item -LiteralPath $p | Format-List FullName, Length, LastWriteTime

      - name: setup_windows.bat 두 번째 실행 (새 버전으로 바꿀 때와 같음)
        shell: cmd
        run: call setup_windows.bat

      - name: 자동 테스트
        shell: cmd
        run: call "%CONDA%\condabin\conda.bat" run -n video-editing --no-capture-output python -m pytest -q

      - name: 한글 이름 임시 폴더에서 연결 시험 (한글 사용자 이름 PC의 setup과 같게)
        shell: pwsh
        run: |
          # 윈도우에서 pytest 임시 폴더에는 사용자 이름이 들어간다. 0xD64D 0xAE38 0xB3D9 = 홍길동
          # cmd(.bat)를 거치면 한글이 깨질 수 있어 환경의 python.exe를 바로 부른다.
          $py = (& "$env:CONDA\condabin\conda.bat" run -n video-editing python -c "import sys; print(sys.executable)" | Select-Object -Last 1).Trim()
          $base = Join-Path $env:RUNNER_TEMP ('pytest-of-' + [char]0xD64D + [char]0xAE38 + [char]0xB3D9)
          & $py -m pytest -q -rs -p no:cacheprovider tests/test_resolve_link.py "--basetemp=$base"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: check_setup.bat (설치 점검)
        shell: cmd
        run: |
          call check_setup.bat
          set RC=%errorlevel%
          type setup_check_result.txt
          exit /b %RC%

      - name: conda 위치 기록이 없어도 찾는지 (사용자 PC처럼 환경 변수 없이)
        shell: cmd
        run: |
          set "CONDA="
          set "CONDA_EXE="
          del "%LOCALAPPDATA%\video-editing-systems\conda_path.txt" >nul 2>&1
          call find_conda.bat
          echo found: %CONDA_BAT%
          if not defined CONDA_BAT exit /b 1

      - name: run_app.bat (바탕화면 아이콘과 같은 실행)
        shell: cmd
        run: |
          call run_app.bat
          set RC=%errorlevel%
          taskkill /f /im pythonw.exe >nul 2>&1
          exit /b %RC%

      - name: AI 도우미 창 (리졸브 없이 설치 → 창 → 결과 파일, 버튼 3개·대화 입력 칸·⋯ 메뉴·아래쪽이 보이는지)
        shell: cmd
        run: |
          call "%CONDA%\condabin\conda.bat" activate video-editing
          python -m app --helper-smoke-test || exit /b 1

      - name: AI 도우미 창 150% 배율 (1080p 노트북에서 흔한 배율, 좁은 모양으로도 잘리지 않는지)
        shell: cmd
        env:
          QT_SCALE_FACTOR: "1.5"
        run: |
          call "%CONDA%\condabin\conda.bat" activate video-editing
          python -m app --helper-smoke-test || exit /b 1

      - name: 창에서 영상 처리까지 (공백 있는 경로)
        shell: cmd
        run: |
          call "%CONDA%\condabin\conda.bat" activate video-editing
          mkdir "%RUNNER_TEMP%\test folder"
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1280x720:r=30000/1001:d=20 -f lavfi -i anoisesrc=c=pink:a=0.05:d=20:r=48000 -map 0:v -map 1:a -c:v mpeg4 -q:v 5 -c:a aac "%RUNNER_TEMP%\test folder\first video.mp4" || exit /b 1
          python -m app --smoke-test "%RUNNER_TEMP%\test folder\first video.mp4" || exit /b 1
          dir "%RUNNER_TEMP%\test folder\first video_resolve"
          type "%RUNNER_TEMP%\test folder\first video_resolve\first video_timeline.fcpxml"

      - name: 리졸브 스크립트(Lua) 시험 (CI에서만 lupa를 설치해서)
        shell: cmd
        run: |
          call "%CONDA%\condabin\conda.bat" activate video-editing
          python -m pip install lupa || exit /b 1
          python -c "import lupa.luajit21 as l; print(l.LuaRuntime().eval('jit.version'))" || exit /b 1
          python -m pytest -q -rs tests/test_lua_script.py tests/test_bridge_roundtrip.py tests/test_resolve_link.py tests/test_probe_leftover.py tests/test_resolve_ops.py || exit /b 1

      - name: 새 판 받기 준비 (지금 코드로 ZIP 만들기, 지워질 파일과 사용자 파일 심기)
        shell: pwsh
        run: |
          # ⋯ > 새 판 받기는 GitHub에서 ZIP을 받는다. 여기서는 지금 코드로 같은 모양의 ZIP을 만든다
          git archive --format=zip --prefix=video-editing-systems-update-test/ -o (Join-Path $env:RUNNER_TEMP 'update-test.zip') HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 새 판에 없는 코드 파일(지워져야 함)과 사용자가 폴더에 넣어 둔 파일(남아야 함)
          Set-Content -LiteralPath 'app\zz_stale_for_update_test.py' -Value '# not in the new version'
          Set-Content -LiteralPath 'my_notes_update_test.txt' -Value 'my own notes'
          # 이 프로그램이 아닌 ZIP (받아도 아무것도 바꾸지 않아야 함)
          $bad = Join-Path $env:RUNNER_TEMP 'not-this-program'
          New-Item -ItemType Directory -Force -Path (Join-Path $bad 'something') | Out-Null
          Set-Content -LiteralPath (Join-Path $bad 'something\readme.txt') -Value 'hello'
          Compress-Archive -Path (Join-Path $bad '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'not-this-program.zip') -Force

      - name: 새 판 받기 거절 (창이 아직 열려 있음, 빈칸·괄호·작은따옴표·한글이 든 임시 폴더)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 한글 사용자 이름 PC의 %LOCALAPPDATA%처럼. 0xD64D 0xAE38 0xB3D9 = 홍길동
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ("local (1) it's " + [char]0xD64D + [char]0xAE38 + [char]0xB3D9)
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:AIH_UPDATE_ZIP = Join-Path $env:RUNNER_TEMP 'update-test.zip'
          $env:AIH_UPDATE_WAIT = '3'
          # 앱 대신 오래 도는 프로그램의 PID를 넘긴다: 기다리다가 아무것도 바꾸지 않고 멈춰야 한다
          $app = Start-Process -FilePath 'ping.exe' -ArgumentList '-n', '120', '127.0.0.1' -PassThru -WindowStyle Hidden
          $appId = $app.Id
          $log = Join-Path $env:RUNNER_TEMP 'update_refused.txt'
          & cmd.exe /d /c update_windows.bat $appId *> $log
          $rc = $LASTEXITCODE
          Stop-Process -Id $appId -Force -ErrorAction SilentlyContinue
          $text = Get-Content -LiteralPath $log -Raw
          $text
          if ($rc -eq 0) { Write-Error "창이 열려 있는데 새 판을 넣음"; exit 1 }
          if ($text -notmatch 'still open') { Write-Error "창이 열려 있다는 안내가 없음"; exit 1 }
          if (-not (Test-Path -LiteralPath 'app\zz_stale_for_update_test.py')) { Write-Error "거절했는데 파일이 바뀜"; exit 1 }
          $copy = Join-Path $env:LOCALAPPDATA 'video-editing-systems\update\update_windows.bat'
          if (-not (Test-Path -LiteralPath $copy)) { Write-Error "임시 폴더의 복사본이 없음: $copy"; exit 1 }

      - name: 새 판 받기 거절 (이 프로그램이 아닌 ZIP, 같은 한글 임시 폴더)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ("local (1) it's " + [char]0xD64D + [char]0xAE38 + [char]0xB3D9)
          $env:AIH_UPDATE_ZIP = Join-Path $env:RUNNER_TEMP 'not-this-program.zip'
          $log = Join-Path $env:RUNNER_TEMP 'update_bad_zip.txt'
          & cmd.exe /d /c update_windows.bat *> $log
          $rc = $LASTEXITCODE
          $text = Get-Content -LiteralPath $log -Raw
          $text
          if ($rc -eq 0) { Write-Error "이 프로그램이 아닌 ZIP을 넣음"; exit 1 }
          if ($text -notmatch 'not a complete version') { Write-Error "받은 파일이 이상하다는 안내가 없음"; exit 1 }
          if (-not (Test-Path -LiteralPath 'app\zz_stale_for_update_test.py')) { Write-Error "거절했는데 파일이 바뀜"; exit 1 }
          $work = Join-Path $env:LOCALAPPDATA 'video-editing-systems\update'
          foreach ($left in 'download.zip', 'extract') {
            if (Test-Path -LiteralPath (Join-Path $work $left)) { Write-Error "임시 파일이 남음: $left"; exit 1 }
          }

      - name: update_windows.bat (새 판 받기와 같은 일, 받는 대신 만든 ZIP으로)
        shell: cmd
        run: |
          set "AIH_UPDATE_ZIP=%RUNNER_TEMP%\update-test.zip"
          call update_windows.bat > "%RUNNER_TEMP%\update_log.txt" 2>&1
          set RC=%errorlevel%
          type "%RUNNER_TEMP%\update_log.txt"
          exit /b %RC%

      - name: 새 판 받기 뒤 확인 (지울 파일은 지워지고 사용자 파일은 남고, 테스트는 건너뛰고, 바로가기는 그대로)
        shell: pwsh
        run: |
          $log = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'update_log.txt') -Raw
          if (Test-Path -LiteralPath 'app\zz_stale_for_update_test.py') { Write-Error "새 판에 없는 코드 파일이 남아 있음"; exit 1 }
          if (-not (Test-Path -LiteralPath 'my_notes_update_test.txt')) { Write-Error "사용자가 넣어 둔 파일이 지워짐"; exit 1 }
          if ($log -notmatch 'Automatic tests skipped for a quick update') { Write-Error "빠른 설치인데 테스트를 건너뛴다는 줄이 없음"; exit 1 }
          if ($log -match 'Running automatic tests') { Write-Error "빠른 설치인데 테스트를 돌림"; exit 1 }
          if ($log -notmatch 'Update finished') { Write-Error "다 됐다는 줄이 없음"; exit 1 }
          # setup_windows.bat과 같은 방법으로 이름을 만든다 (0xB3C4 0xC6B0 0xBBF8 = 도우미)
          $desktop = [Environment]::GetFolderPath('Desktop')
          $p = Join-Path $desktop ('AI ' + [char]0xB3C4 + [char]0xC6B0 + [char]0xBBF8 + '.lnk')
          if (-not (Test-Path -LiteralPath $p)) { Write-Error "바로가기 없음: $p"; exit 1 }
          $copy = Join-Path $env:RUNNER_TEMP 'shortcut-check-after-update.lnk'
          Copy-Item -LiteralPath $p -Destination $copy -Force
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($copy).TargetPath
          $target
          if (-not $target.EndsWith('run_app.bat')) { Write-Error "바로가기 대상이 다름: $target"; exit 1 }
          $work = Join-Path $env:LOCALAPPDATA 'video-editing-systems\update'
          foreach ($left in 'download.zip', 'extract') {
            if (Test-Path -LiteralPath (Join-Path $work $left)) { Write-Error "임시 파일이 남음: $left"; exit 1 }
          }

      - name: 새 판 받기 뒤 AI 도우미 창 (창이 그대로 뜨는지)
        shell: cmd
        run: |
          call "%CONDA%\condabin\conda.bat" activate video-editing
          python -m app --helper-smoke-test || exit /b 1

      - name: 기록 파일 모으기
        if: always()
        shell: cmd
        run: |
          mkdir logs
          copy "%LOCALAPPDATA%\video-editing-systems\*.log" logs\ >nul 2>&1
          copy setup_check_result.txt logs\ >nul 2>&1
          copy "%LOCALAPPDATA%\video-editing-systems\AI*.txt" logs\ >nul 2>&1
          copy "%RUNNER_TEMP%\update_*.txt" logs\ >nul 2>&1
          exit /b 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs
          path: logs
